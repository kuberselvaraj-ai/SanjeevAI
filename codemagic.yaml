# Codemagic CI for the SanjeevAI native shells (Capacitor 7, thin-shell mode —
# the apps load the live Cloud Run site; webDir is bundled as fallback).
#
# One-time setup in the Codemagic UI:
#   1. Add application → GitHub → kuberselvaraj-ai/SanjeevAI (this file is
#      picked up automatically).
#   2. Environment groups:
#      - `android_signing`: upload your upload-keystore (CM_KEYSTORE_PATH,
#        CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_ALIAS_PASSWORD).
#        Generate locally with:
#          keytool -genkey -v -keystore sanjeevai-upload.keystore \
#            -alias sanjeevai -keyalg RSA -keysize 2048 -validity 10000
#      - `manual_signing` + App Store Connect integration (Teams →
#        Integrations → App Store Connect) for iOS distribution.
#
# Builds are tag-triggered:  git tag ios-1.0.0 && git push --tags
# (or hit "Start new build" manually in the Codemagic UI).

workflows:
  ios-app-store:
    name: SanjeevAI iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include: true
    environment:
      groups:
        - manual_signing
      vars:
        BUNDLE_ID: com.sanjeevai.app
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # Baked into the web bundle (thin shell barely uses it, but the
        # fallback shell and OAuth URL construction need real values).
        VITE_APP_ID: $VITE_APP_ID
        VITE_KIMI_AUTH_URL: $VITE_KIMI_AUTH_URL
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci --no-audit --no-fund
      - name: Build web bundle (fallback shell)
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # Uses the App Store Connect API integration from the Codemagic UI.
        auth: integration
        submit_to_testflight: true

  android-play:
    name: SanjeevAI Android — Play (AAB)
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "android-*"
          include: true
    environment:
      groups:
        - android_signing
      vars:
        PACKAGE_NAME: com.sanjeevai.app
        VITE_APP_ID: $VITE_APP_ID
        VITE_KIMI_AUTH_URL: $VITE_KIMI_AUTH_URL
      node: 20
    scripts:
      - name: Install JS dependencies
        script: npm ci --no-audit --no-fund
      - name: Build web bundle (fallback shell)
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    # Google Play publishing intentionally left off (same as XYeed) — upload
    # the AAB manually to Play Console until the track is ready.
